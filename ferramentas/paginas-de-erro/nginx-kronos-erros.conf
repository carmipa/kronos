# =============================================================================
# KRONOS CORE — páginas de erro servidas pelo nginx quando o KRONOS está FORA DO AR
# (502/503/504). Só faz sentido para a vitrine publicada atrás de um proxy; o
# KRONOS local não tem nginx na frente. Aplicar na VPS é decisão de deploy.
#
# Preparação: copie, da MESMA versão do contêiner no ar, as pastas do estático
# que as páginas usam para uma pasta que o nginx enxergue. No Nginx Proxy Manager
# da VPS (medido em 15/10/2026), /opt/infra-proxy/data do host aparece como /data
# dentro do contêiner do proxy:
#   src/main/resources/static/errors  -> /opt/infra-proxy/data/kronos-erros/errors
#   src/main/resources/static/dica    -> /opt/infra-proxy/data/kronos-erros/dica
#   src/main/resources/static/i18n    -> /opt/infra-proxy/data/kronos-erros/i18n
# e inclua o bloco abaixo dentro do `server { ... }` do site (no proxy host do
# kronos, ou na aba "Advanced" do NPM).
# =============================================================================

proxy_intercept_errors on;
error_page 502 /errors/502.html;
error_page 503 /errors/503.html;
error_page 504 /errors/504.html;

# As páginas usam caminhos absolutos. Com o KRONOS fora do ar, o próprio CSS,
# o JS, o tooltip e as bandeiras também precisam sair do disco — senão a página
# de erro chega sem estilo. Com o KRONOS no ar, a cópia em disco é a mesma versão.
location ^~ /errors/ { root /data/kronos-erros; try_files $uri @kronos; }
location ^~ /dica/   { root /data/kronos-erros; try_files $uri @kronos; }
location ^~ /i18n/   { root /data/kronos-erros; try_files $uri @kronos; }

# Volta ao contêiner pelo MESMO destino do proxy host. Dentro do contêiner do NPM,
# 127.0.0.1 é o próprio proxy, não a vitrine: use as variáveis do host.
location @kronos {
    proxy_set_header Host $host;
    proxy_pass $forward_scheme://$server:$port;
}
