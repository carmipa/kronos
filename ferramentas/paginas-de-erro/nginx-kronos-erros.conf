# =============================================================================
# KRONOS CORE — páginas de erro servidas pelo nginx quando o KRONOS está FORA DO AR
# (502/503/504). Só faz sentido para a vitrine publicada atrás de um proxy; o
# KRONOS local não tem nginx na frente. Aplicar na VPS é decisão de deploy.
#
# Preparação: copie para /var/www/kronos-erros as pastas do estático que as
# páginas usam, da MESMA versão do contêiner no ar:
#   src/main/resources/static/errors  -> /var/www/kronos-erros/errors
#   src/main/resources/static/dica    -> /var/www/kronos-erros/dica
#   src/main/resources/static/i18n    -> /var/www/kronos-erros/i18n
# e inclua o bloco abaixo dentro do `server { ... }` do site (no Nginx Proxy
# Manager: aba "Advanced" do proxy host).
# =============================================================================

proxy_intercept_errors on;
error_page 502 /errors/502.html;
error_page 503 /errors/503.html;
error_page 504 /errors/504.html;

# As páginas usam caminhos absolutos. Com o KRONOS fora do ar, o próprio CSS,
# o JS, o tooltip e as bandeiras também precisam sair do disco — senão a página
# de erro chega sem estilo. Com o KRONOS no ar, a cópia em disco é a mesma versão.
location ^~ /errors/ { root /var/www/kronos-erros; try_files $uri @kronos; }
location ^~ /dica/   { root /var/www/kronos-erros; try_files $uri @kronos; }
location ^~ /i18n/   { root /var/www/kronos-erros; try_files $uri @kronos; }

# Upstream de exemplo: o contêiner da vitrine publica só no loopback.
location @kronos {
    proxy_pass http://127.0.0.1:18099;
}
