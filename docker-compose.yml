# KRONOS CORE — execução local em contêiner.
#
# O KRONOS NÃO VAI PARA VPS. Ele roda na máquina de quem usa, conversando com um
# LM Studio que está no host. Por isso a porta é publicada apenas em 127.0.0.1 e
# não há proxy, TLS ou rede externa aqui.
#
#   docker compose build
#   docker compose up -d
#   docker compose logs -f kronos
#
# Antes do primeiro `up`, copie `.env.example` para `.env` e confira o caminho
# do acervo.

# Nome do projeto FIXO. Sem ele o Compose deriva o nome da pasta, e o volume do
# Redis se chama <pasta>_redis-dados: renomear a pasta (o repositório virou
# carmipa/kronos em 26/10/2026) faria o Redis subir com um volume novo e vazio,
# deixando o antigo órfão. Este é o nome que a pasta produzia até aqui.
name: traducao_animes_llm_local_quarkus-1

services:
  kronos:
    build:
      context: .
      dockerfile: Dockerfile
    image: kronos-core:local
    container_name: kronos
    restart: unless-stopped

    ports:
      # Preso ao loopback DE PROPÓSITO. Publicar como "8099:8099" exporia a
      # interface a toda a rede local, e esta aplicação lê e ESCREVE no acervo
      # de legendas — não há autenticação nenhuma na frente dela.
      - "127.0.0.1:8099:8099"

    environment:
      # O LM Studio roda no HOST, fora do contêiner. Dentro do contêiner,
      # 127.0.0.1 é o próprio contêiner: sem esta variável a tradução morre no
      # primeiro lote com recusa de conexão.
      #
      # DEPENDE de application.yml passar a ler a variável em
      # tradutor.llm.base-url e revisao-lore.llm.base-url. Enquanto essa mudança
      # não entrar, o valor aqui é inerte. Ver docs/ref-docker.md.
      KRONOS_LLM_BASE_URL: "${KRONOS_LLM_BASE_URL:-http://host.docker.internal:1234/v1}"
      TZ: "America/Sao_Paulo"

      # Dentro do contêiner, 127.0.0.1 é só o loopback DELE: a aplicação sobe,
      # o healthcheck interno passa e o host mesmo assim não alcança nada.
      # Medido em 06/08/2026 — "Up (healthy)" e conexão recusada ao mesmo tempo.
      # Ouvir em 0.0.0.0 aqui NÃO abre a aplicação para a rede: quem limita é a
      # publicação da porta acima, presa a 127.0.0.1 do host.
      QUARKUS_HTTP_HOST: "0.0.0.0"

      # Repositório do dataset de telemetria, montado do host logo abaixo.
      KRONOS_DATASET_REPO: "/dataset"

      # Redis: fluxo AO VIVO de eventos de telemetria, ADITIVO. O
      # telemetria_execucoes.jsonl continua sendo a fonte do dataset, porque
      # arquivo em disco sobrevive a kill -9 e Redis com AOF perde os ultimos
      # milissegundos — para telemetria que vira dataset, perder evento e perder
      # dado. Sem Redis no ar, tudo funciona como antes.
      KRONOS_REDIS_URL: "redis://redis:6379"

    extra_hosts:
      # Docker Desktop resolve host.docker.internal sozinho; em Docker Engine no
      # Linux, não. A linha abaixo faz o compose valer nos dois.
      - "host.docker.internal:host-gateway"

    volumes:
      # O ACERVO. Montado no mesmo ponto que a tradução de caminho da borda
      # espera. O KRONOS lê E grava aqui (legenda traduzida, backup de
      # achatamento), então não é somente-leitura.
      #
      # `:?` E OBRIGATORIO, E NAO E ESTILO. Até 11/08/2026 esta linha era
      # `${KRONOS_ACERVO:-C:/animes}`.
      #
      # MEDIDO em 11/08/2026: `docker compose --env-file /dev/null config` saía
      # 0 e imprimia `source: C:/animes` — quem esquecesse o `.env` montava, em
      # silêncio, um caminho que ninguém configurou. Agora sai 1 e diz o que falta.
      #
      # TAMBÉM MEDIDO em 11/08/2026, com o Docker no ar: bind mount para caminho
      # que NÃO existe no host não é recusado — o Docker CRIA a pasta e o
      # contêiner a enxerga vazia (`ls -la` dentro dela: só `.` e `..`; o que se
      # escreve ali cai no host). Ou seja, com o default silencioso um caminho
      # errado nunca produzia erro: produzia acervo vazio, e o KRONOS reporta
      # "nada a traduzir" — o mesmo sinal de "acervo não montado".
      # É a regra de falha fechada de docs/ref-docker.md: varredura cega e pasta
      # vazia não podem emitir o mesmo sinal.
      - "${KRONOS_ACERVO:?defina KRONOS_ACERVO no .env com a raiz do acervo no host}:/acervo"

      # Estado que precisa sobreviver ao contêiner. Fica como bind mount, e não
      # como volume nomeado, porque estes arquivos são conferidos, editados e
      # copiados à mão com frequência — foi editando o JSON do cache que se
      # corrigiu 53 cartões de data. Volume nomeado esconderia isso dentro do
      # Docker e tornaria a inspeção um exercício de arqueologia.
      - ./cache:/app/cache
      - ./logs:/app/logs
      - ./relatorios:/app/relatorios
      - ./backups:/app/backups

      # Repositório dedicado do dataset público de telemetria. Montado do host
      # para que o commit feito aqui dentro caia no repositório REAL — o push
      # continua sendo feito do host, porque credencial de git não entra em
      # contêiner. É a divisão deliberada: o contêiner escreve e versiona, o
      # host publica.
      #
      # `:?` pelo mesmo motivo do acervo, com dano próprio: com o default
      # silencioso, um host cujo repositório irmão esteja em outro lugar montava
      # em /dataset uma pasta que não é o repositório real, e "Publicar Dataset"
      # faria git init/add/commit ali — publicação que reporta sucesso sem publicar.
      - "${KRONOS_DATASET_REPO_HOST:?defina KRONOS_DATASET_REPO_HOST no .env com o caminho do repositorio do dataset no host}:/dataset"

    # O pipeline é pesado em CPU e o LM Studio disputa a mesma máquina. Sem teto,
    # um lote grande deixa o host sem folga e o próprio LLM desacelera — o
    # contêiner competiria com aquilo de que ele depende.
    deploy:
      resources:
        limits:
          memory: 4G

    # service_started, NÃO service_healthy. O KRONOS tem de subir mesmo com o
    # Redis fora do ar — essa é a garantia central do desenho, e amarrar o boot
    # à saúde do Redis a destruiria logo na primeira linha do compose.
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:8-alpine
    container_name: kronos-redis
    restart: unless-stopped

    # appendonly liga o AOF: o fluxo sobrevive a reinício do contêiner. `--save ""`
    # desliga o snapshot RDB, que aqui só duplicaria trabalho — o AOF já cobre, e
    # a verdade do dataset continua sendo o arquivo JSONL do KRONOS.
    command: ["redis-server", "--appendonly", "yes", "--save", ""]

    # NÃO publica porta no host. O Redis existe para o KRONOS, e só ele fala com
    # o Redis pela rede interna do compose. Expor 6379 seria abrir um banco sem
    # autenticação na máquina de quem usa.
    expose:
      - "6379"

    volumes:
      - redis-dados:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 10s

    deploy:
      resources:
        limits:
          memory: 512M

volumes:
  # Volume NOMEADO, ao contrário do resto: o AOF é formato interno do Redis, não
  # se lê nem se conserta à mão. Deixá-lo como bind mount só encheria a pasta do
  # projeto de arquivo binário opaco.
  redis-dados:
